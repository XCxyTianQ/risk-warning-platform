name: Release Desktop (Windows / macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v0.5.0），留空则用当前时间戳'
        required: false

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  # CI 的 Windows runner 控制台默认 cp1252，统一 UTF-8 避免中文输出报错
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'

jobs:
  # ------------------------------------------------------------------
  # Windows x64：NSIS 安装包 + 便携版
  # 后端为 Rust 单文件二进制（x86_64-pc-windows-msvc），不再依赖 Python 解释器
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RWP_TARGET: x86_64-pc-windows-msvc
      BACKEND_EXE: desktop/resources/backend/risk-warning-backend.exe
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend into desktop/resources/web
        working-directory: desktop
        run: node scripts/build-web.js

      - name: Build backend (cargo release)
        working-directory: desktop
        run: node scripts/build-backend.js

      - name: Smoke-test packaged backend binary
        working-directory: desktop
        run: node scripts/smoke-backend.js

      - name: Verify resources before packaging
        working-directory: desktop
        shell: pwsh
        run: |
          if (!(Test-Path 'resources/web/index.html')) { throw 'resources/web 缺失：前端未构建' }
          if (!(Test-Path 'resources/backend/risk-warning-backend.exe')) { throw 'resources/backend 缺失：后端未构建' }
          $size = (Get-Item 'resources/backend/risk-warning-backend.exe').Length / 1MB
          Write-Output ("resources OK（后端 {0:N1} MB）" -f $size)

      - name: Package Electron app
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - name: Inspect packaged app (web + backend present)
        working-directory: desktop
        shell: pwsh
        run: |
          $app = 'release/win-unpacked/resources'
          if (!(Test-Path "$app/web/index.html")) { throw '安装包内缺少前端资源（应用会白屏）' }
          if (!(Test-Path "$app/backend/risk-warning-backend.exe")) { throw '安装包内缺少后端可执行文件' }
          if (!(Test-Path "$app/samples/dataset.json")) { throw '安装包内缺少样例数据' }
          Write-Output 'OK: 前端/后端/样例均已打入应用'

      - name: Compute checksums
        working-directory: desktop/release
        shell: pwsh
        run: |
          Get-FileHash *.exe -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))"
          } | Tee-Object -FilePath SHA256SUMS-windows.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS-windows.txt
          if-no-files-found: error

  # ------------------------------------------------------------------
  # macOS Apple Silicon（arm64）：dmg + zip（未签名，需手动解除隔离）
  # ------------------------------------------------------------------
  build-macos-arm64:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RWP_TARGET: aarch64-apple-darwin
      BACKEND_BIN: desktop/resources/backend/risk-warning-backend
      EXPECTED_ARCH: arm64
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend into desktop/resources/web
        working-directory: desktop
        run: node scripts/build-web.js

      - name: Build backend (cargo release)
        working-directory: desktop
        run: node scripts/build-backend.js

      - name: Smoke-test packaged backend binary
        working-directory: desktop
        run: node scripts/smoke-backend.js

      - name: Verify resources + backend architecture
        working-directory: desktop
        run: |
          set -e
          test -f resources/web/index.html || { echo "::error::resources/web 缺失：前端未构建"; exit 1; }
          test -x resources/backend/risk-warning-backend || { echo "::error::resources/backend 缺失或不可执行"; exit 1; }
          file resources/backend/risk-warning-backend
          file resources/backend/risk-warning-backend | grep -q "$EXPECTED_ARCH" || {
            echo "::error::后端架构不是 $EXPECTED_ARCH（会与 Electron 包架构不匹配）"; exit 1; }
          echo "resources OK（$EXPECTED_ARCH）"

      - name: Package Electron app
        working-directory: desktop
        run: npx electron-builder --mac --arm64 --publish never

      - name: Verify single-arch output
        working-directory: desktop/release
        run: |
          set -e
          ls -lh
          ls RiskWarningPlatform-*-mac-arm64.dmg >/dev/null
          ls RiskWarningPlatform-*-mac-arm64.zip >/dev/null
          if ls RiskWarningPlatform-*-mac-x64.dmg >/dev/null 2>&1; then
            echo "::error::arm64 任务不应产出 x64 包（其内嵌后端为 arm64，在 Intel Mac 上无法运行）"
            exit 1
          fi

      - name: Inspect app bundle (web + backend present, backend executable)
        working-directory: desktop/release
        run: |
          set -e
          ZIP=$(ls RiskWarningPlatform-*-mac-arm64.zip)
          echo "== 关键内容 =="
          zipinfo -l "$ZIP" | grep -E "Contents/Resources/(web/index\.html|samples/dataset\.json|backend/risk-warning-backend)" || true
          zipinfo -l "$ZIP" | grep -E "^-.*Contents/Resources/web/index\.html$" >/dev/null || {
            echo "::error::app 内缺少前端资源 web/index.html（应用会白屏）"; exit 1; }
          zipinfo -l "$ZIP" | grep -E "^-rwx.*Contents/Resources/backend/risk-warning-backend$" >/dev/null || {
            echo "::error::app 内缺少可执行的后端二进制，或执行权限位丢失"; exit 1; }
          echo "OK: 前端资源与后端二进制均已打入 app 包"

      - name: Package macOS source fallback (no Gatekeeper needed)
        run: |
          set -e
          VERSION=$(node -p "require('./desktop/package.json').version")
          PKG="dist-fallback/RiskWarningPlatform-macos"
          rm -rf dist-fallback
          mkdir -p "$PKG/server" "$PKG/web" "$PKG/data"
          cp -R server/app server/desktop_entry.py server/requirements.txt "$PKG/server/"
          find "$PKG" -name __pycache__ -type d -exec rm -rf {} +
          cp -R web/dist "$PKG/web/dist"
          cp -R data/samples "$PKG/data/samples"
          cp macos/start.command macos/README.txt "$PKG/"
          chmod +x "$PKG/start.command"
          cd dist-fallback
          zip -rq "../desktop/release/RiskWarningPlatform-${VERSION}-macos-source.zip" RiskWarningPlatform-macos
          echo "fallback package:"; unzip -l "../desktop/release/RiskWarningPlatform-${VERSION}-macos-source.zip" | tail -3

      - name: Compute checksums
        working-directory: desktop/release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-macos-arm64.txt && cat SHA256SUMS-macos-arm64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-arm64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error

  # ------------------------------------------------------------------
  # macOS Intel（x64）：dmg + zip
  # 该 runner 若不可用则跳过，不阻塞其余平台的发布
  # ------------------------------------------------------------------
  build-macos-x64:
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      RWP_TARGET: x86_64-apple-darwin
      EXPECTED_ARCH: x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend into desktop/resources/web
        working-directory: desktop
        run: node scripts/build-web.js

      - name: Build backend (cargo release)
        working-directory: desktop
        run: node scripts/build-backend.js

      - name: Smoke-test packaged backend binary
        working-directory: desktop
        run: node scripts/smoke-backend.js

      - name: Verify resources + backend architecture
        working-directory: desktop
        run: |
          set -e
          test -f resources/web/index.html || { echo "::error::resources/web 缺失：前端未构建"; exit 1; }
          test -x resources/backend/risk-warning-backend || { echo "::error::resources/backend 缺失或不可执行"; exit 1; }
          file resources/backend/risk-warning-backend
          file resources/backend/risk-warning-backend | grep -q "$EXPECTED_ARCH" || {
            echo "::error::后端架构不是 $EXPECTED_ARCH（会与 Electron 包架构不匹配）"; exit 1; }
          echo "resources OK（$EXPECTED_ARCH）"

      - name: Package Electron app
        working-directory: desktop
        run: npx electron-builder --mac --x64 --publish never

      - name: Verify single-arch output
        working-directory: desktop/release
        run: |
          set -e
          ls -lh
          ls RiskWarningPlatform-*-mac-x64.dmg >/dev/null
          ls RiskWarningPlatform-*-mac-x64.zip >/dev/null
          if ls RiskWarningPlatform-*-mac-arm64.dmg >/dev/null 2>&1; then
            echo "::error::x64 任务不应产出 arm64 包（其内嵌后端为 x86_64，在 Apple Silicon 上无法运行）"
            exit 1
          fi

      - name: Inspect app bundle (web + backend present, backend executable)
        working-directory: desktop/release
        run: |
          set -e
          ZIP=$(ls RiskWarningPlatform-*-mac-x64.zip)
          echo "== 关键内容 =="
          zipinfo -l "$ZIP" | grep -E "Contents/Resources/(web/index\.html|samples/dataset\.json|backend/risk-warning-backend)" || true
          zipinfo -l "$ZIP" | grep -E "^-.*Contents/Resources/web/index\.html$" >/dev/null || {
            echo "::error::app 内缺少前端资源 web/index.html（应用会白屏）"; exit 1; }
          zipinfo -l "$ZIP" | grep -E "^-rwx.*Contents/Resources/backend/risk-warning-backend$" >/dev/null || {
            echo "::error::app 内缺少可执行的后端二进制，或执行权限位丢失"; exit 1; }
          echo "OK: 前端资源与后端二进制均已打入 app 包"

      - name: Compute checksums
        working-directory: desktop/release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS-macos-x64.txt && cat SHA256SUMS-macos-x64.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-x64
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/SHA256SUMS-macos-x64.txt
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 汇总发布（任一平台失败不影响其余产物上传）
  # ------------------------------------------------------------------
  publish:
    needs: [build-windows, build-macos-arm64, build-macos-x64]
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/release-${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: false
