name: Bench (评测)

# M0：每次 push / PR 跑确定性套件（探针 + 平台量化指标），产出并归档评测报告。
# GUI 冒烟在独立 job 里"实验性"尝试（CI 无界面时自动跳过，不会误判为失败）。
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'

jobs:
  bench:
    name: 探针 + 平台指标
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: desktop
        run: node scripts/build-web.js

      - name: Build backend
        working-directory: desktop
        run: node scripts/build-backend.js

      - name: Run bench (no GUI)
        run: node bench/run.js --no-gui

      - name: Publish report to job summary
        if: always()
        shell: pwsh
        run: |
          $md = 'bench/report/bench-report.md'
          if (Test-Path $md) {
            Get-Content $md -Encoding UTF8 | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          } else {
            '评测报告未生成（run.js 提前失败）' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-report
          path: |
            bench/report/bench-report.json
            bench/report/bench-report.md
            bench/report/logs/
          if-no-files-found: warn

  bench-gui:
    name: GUI 冒烟（实验性）
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend + backend
        working-directory: desktop
        run: |
          node scripts/build-web.js
          node scripts/build-backend.js

      - name: Run bench (GUI, experimental)
        run: node bench/run.js --with-gui --skip probe-datasource-golden

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: bench-report-gui
          path: |
            bench/report/bench-report.json
            bench/report/bench-report.md
            bench/report/logs/
          if-no-files-found: warn
